[project]
name = "cyber-skill-mcp"
version = "0.1.0"
description = "Sandbox-First MCP Server для безопасного реверс-инжиниринга"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "pyyaml>=6.0",
    "docker>=7.0.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["server*", "sandbox*"]
