name: CI - Проверка кода

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  check-code:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Настройка Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        
    - name: Установка зависимостей
      run: |
        python -m pip install --upgrade pip
        pip install pyyaml docker mcp
        
    - name: Проверка синтаксиса Python
      run: |
        echo "Проверяем Python файлы..."
        python -m compileall -q .
        echo "✅ Синтаксис Python в порядке!"
        
    - name: Проверка YAML навыков
      run: |
        echo "Проверяем файлы навыков..."
        python -c "
        import yaml, sys, pathlib
        errors = []
        for f in pathlib.Path('registry').rglob('*.yaml'):
            try:
                with open(f) as file: yaml.safe_load(file)
            except Exception as e: errors.append(f'{f}: {e}')
        if errors:
            print('❌ Ошибки в YAML:', errors)
            sys.exit(1)
        print('✅ Все YAML файлы валидны!')
        "
